Pada tangkapan layar, filter **Jam Mulai Sesi Ujian** terisi 14.17. Pada Apps Script, kondisi filter waktu ditulis `passWaktu = waktuFilter === "" || jamMenitSiswa === "" || jamMenitSiswa >= waktuFilter;`. Karena waktu masuk siswa di spreadsheet berkisar antara 12:4x hingga 15:1x, siswa yang masuk sebelum jam 14:17 otomatis terfilter (hilang dari tabel). Selain itu, format jam `14.17` atau jam tanpa detik di spreadsheet sering kali membuat perbandingan string jam gagal.

Berikut adalah perbaikannya agar data dapat tampil secara konsisten:

---

### 1. Perbaikan Kode Google Apps Script (`doGet`)

Ganti bagian `action == "getMonitoring"` di Apps Script dengan kode berikut. Kode ini memperbaiki cara membaca tanggal/jam dari Google Sheets agar tidak terpengaruh perbedaan format `Date` dan `String`:

```javascript
  // 3. MONITORING
  if (action == "getMonitoring") {
    var ruangFilter = e.parameter.ruang ? cleanString(e.parameter.ruang) : "SEMUA";
    var tglFilter = e.parameter.tanggal ? cleanString(e.parameter.tanggal) : "";
    var waktuFilter = e.parameter.waktuMulai ? cleanString(e.parameter.waktuMulai).replace('.', ':') : "";
    
    var tglTargetStr = "";
    if (tglFilter !== "") {
      var tParts = tglFilter.split("-");
      if (tParts.length === 3) {
        // Mengubah format YYYY-MM-DD ke DD/MM/YYYY
        tglTargetStr = ("0" + tParts[2]).slice(-2) + "/" + ("0" + tParts[1]).slice(-2) + "/" + tParts[0];
      }
    }

    var sheetMonitoring = ss.getSheetByName("Monitoring");
    if (!sheetMonitoring) {
      return responseJSON({ status: "success", data: [] });
    }
    
    var rows = sheetMonitoring.getDataRange().getValues();
    var result = [];
    
    for (var m = 1; m < rows.length; m++) {
      var rWaktuRaw = rows[m][0];
      var rRuang = rows[m][3] ? cleanString(rows[m][3]) : "-";
      var rKamera = rows[m][6] ? cleanString(rows[m][6]) : "-";
      
      if (!rows[m][1]) continue; // Lewati jika nama kosong

      var waktuStr = "";
      var jamMenitSiswa = ""; 
      var tglSiswa = "";

      if (rWaktuRaw instanceof Date) {
        waktuStr = Utilities.formatDate(rWaktuRaw, "Asia/Jakarta", "dd/MM/yyyy HH:mm:ss");
        jamMenitSiswa = Utilities.formatDate(rWaktuRaw, "Asia/Jakarta", "HH:mm");
        tglSiswa = Utilities.formatDate(rWaktuRaw, "Asia/Jakarta", "dd/MM/yyyy");
      } else {
        waktuStr = rWaktuRaw ? cleanString(rWaktuRaw) : "";
        var parts = waktuStr.split(" ");
        if (parts.length > 0) tglSiswa = parts[0];
        if (parts.length > 1) {
          var timeParts = parts[1].split(":");
          if (timeParts.length >= 2) {
            jamMenitSiswa = ("0" + timeParts[0]).slice(-2) + ":" + ("0" + timeParts[1]).slice(-2);
          }
        }
      }
      
      // Normalisasi format tanggal tunggal seperti 3/9/2026 menjadi 03/09/2026
      if (tglSiswa !== "") {
        var dParts = tglSiswa.split("/");
        if (dParts.length === 3) {
          tglSiswa = ("0" + dParts[0]).slice(-2) + "/" + ("0" + dParts[1]).slice(-2) + "/" + dParts[2];
        }
      }
      
      var passRuang = (ruangFilter === "SEMUA" || rRuang === ruangFilter);
      var passTanggal = (tglTargetStr === "" || tglSiswa === tglTargetStr);
      var passWaktu = (waktuFilter === "" || jamMenitSiswa === "" || jamMenitSiswa >= waktuFilter);
      
      if (passRuang && passTanggal && passWaktu) {
        result.push({
          waktu: waktuStr,
          nama: rows[m][1],
          kelas: rows[m][2],
          ruang: rows[m][3],
          mapel: rows[m][4],
          status: rows[m][5],
          kamera: rKamera
        });
      }
    }
    
    return responseJSON({ status: "success", data: result });
